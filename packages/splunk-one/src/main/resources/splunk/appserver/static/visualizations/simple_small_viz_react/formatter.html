<form class="splunk-formatter-section" section-label="Simple tile">
    <splunk-control-group label="Label">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.label" value=""></splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Unit suffix">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.unit" value=""></splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Colors">
    <splunk-control-group label="Background">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.background" value="#1B2A41"></splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Text">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.textColor" value="#FFFFFF"></splunk-color-picker>
    </splunk-control-group>
</form>
