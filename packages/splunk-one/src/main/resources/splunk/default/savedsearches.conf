# Splunk 10.2+ rejects display.visualizations.custom.* keys under [default] in this file.
# Default format values for each custom viz are defined in the viz formatter.html files
# (splunk-control-group default value attributes) and in visualization code.
#
# Property names for format menus are still documented in savedsearches.conf.spec so
# Splunk can validate panel options when they appear on saved searches or dashboards.

# --- Risk dashboard saved searches (token-driven; replace index=risk_* when indexes exist) ---

[risk_summary]
search = | makeresults count=1 | eval total_risk_score=847, previous_total_risk_score=756, delta_percent=12 | eval anomaly_count=23, previous_anomaly_count=18 | eval critical_count=8, high_count=15, medium_count=42, low_count=103 | eval mttd_hours=4.2, mttd_sparkline="5.1,4.8,4.5,4.3,4.2,4.0,3.9"
description = Risk dashboard summary KPIs (P1-P4). Tokens: $filter_earliest$, $filter_latest$, $filter_bu$, $filter_domain$, $filter_severity$
dispatch.earliest_time = $filter_earliest$
dispatch.latest_time = $filter_latest$

[risk_timeseries]
search = | makeresults count=7 | streamstats count as n | eval _time=relative_time(now(), "-" . (7-n) . "h") | eval risk_score=720+n*20, baseline_score=700+n*2, is_anomaly=if(n=3 OR n=5, 1, 0) | fields _time risk_score baseline_score is_anomaly
description = Risk score time series (P5)
dispatch.earliest_time = $filter_earliest$
dispatch.latest_time = $filter_latest$

[risk_heatmap_entity_category]
search = | makeresults count=5 | eval entity_name=case(_serial=1,"host-abc-01", _serial=2,"user-jdoe", _serial=3,"host-db-02", 1=1,"svc-api-gw") | eval risk_category=case(_serial=1,"network", _serial=2,"identity", _serial=3,"cloud", 1=1,"endpoint") | eval value=60+_serial*8
description = Entity x category heatmap (P6)
dispatch.earliest_time = $filter_earliest$
dispatch.latest_time = $filter_latest$

[risk_breakdown_domain]
search = | makeresults count=4 | eval domain=case(_serial=1,"identity", _serial=2,"network", _serial=3,"endpoint", 1=1,"cloud") | eval score=case(_serial=1,312, _serial=2,245, _serial=3,178, 1=1,112)
description = Risk breakdown by domain (P7)
dispatch.earliest_time = $filter_earliest$
dispatch.latest_time = $filter_latest$

[risk_calendar_heatmap]
search = | makeresults count=6 | eval day=case(_serial=1,"Mon", _serial=2,"Mon", _serial=3,"Tue", _serial=4,"Wed", _serial=5,"Thu", 1=1,"Fri") | eval hour=case(_serial=1,"9", _serial=2,"14", _serial=3,"10", _serial=4,"3", _serial=5,"15", 1=1,"11") | eval value=60+_serial*5
description = Calendar heatmap day x hour (P8)
dispatch.earliest_time = $filter_earliest$
dispatch.latest_time = $filter_latest$

[risk_anomalies]
search = | makeresults count=3 | eval id="anom-00"._serial, entity_id=case(_serial=1,"host-abc-01", _serial=2,"user-jdoe", 1=1,"host-db-02") | eval entity_name=entity_id, domain=case(_serial=1,"network", _serial=2,"identity", 1=1,"cloud") | eval severity=case(_serial=1,"critical", _serial=2,"high", 1=1,"medium"), risk_score=90-_serial*5 | eval delta_from_baseline=40, status="open", recurrence_count=1
description = Anomaly investigation table (P9)
dispatch.earliest_time = $filter_earliest$
dispatch.latest_time = $filter_latest$

[risk_entity_detail]
search = | makeresults count=1 | eval entity_id="$filter_entity_id$", entity_name="$filter_entity_id$", current_risk_score=92, threshold=80 | eval owner="SecOps-East", domain="network"
description = Entity detail drawer
dispatch.earliest_time = $filter_earliest$
dispatch.latest_time = $filter_latest$

[risk_filter_options_bu]
search = | makeresults count=3 | eval value=case(_serial=1,"finance", _serial=2,"engineering", 1=1,"operations") | eval label=value
description = Filter F2 business unit options

[risk_filter_options_domain]
search = | makeresults count=2 | eval value=case(_serial=1,"identity", 1=1,"network") | eval label=value
description = Filter F3 domain options (depends on $filter_bu$)
