# Custom visualization: fixed-domain single value + sparkline.
# Folder: appserver/static/visualizations/fixed_single_value/

[fixed_single_value]
label = Fixed single value (splunk-one)
description = Single value with delta and fixed min/max sparkline. Expects column-major results with at least one numeric field (last numeric column is used for the series).
default_height = 200
search_fragment = | timechart span=1h avg(my_metric) as value
supports_drilldown = 0
supports_trellis = 0
