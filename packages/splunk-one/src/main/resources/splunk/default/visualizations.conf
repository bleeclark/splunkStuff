# Canonical custom visualization gallery set.
# Each distinct visualization family has one vanilla JavaScript implementation
# and one React implementation.

[simple_small_viz]
label = SplunkStuff - Simple small viz (JavaScript)
description = Compact vanilla JavaScript tile that shows the latest value from the first numeric field.
default_height = 120
search_fragment = | makeresults count=5 | streamstats count as value
supports_drilldown = 0
supports_trellis = 0

[simple_small_viz_react]
label = SplunkStuff - Simple small viz (React)
description = React implementation of the compact latest-value tile.
default_height = 120
search_fragment = | makeresults count=5 | streamstats count as value
supports_drilldown = 0
supports_trellis = 0

[fixed_single_value]
label = SplunkStuff - Fixed single value (JavaScript)
description = Vanilla JavaScript single value with delta and fixed min/max sparkline. Expects column-major results with at least one numeric field.
default_height = 200
search_fragment = | timechart span=1h avg(my_metric) as value
supports_drilldown = 0
supports_trellis = 0

[fixed_single_value_react]
label = SplunkStuff - Fixed single value (React)
description = React-based single value with delta and fixed min/max sparkline. Expects column-major results with at least one numeric field.
default_height = 200
search_fragment = | timechart span=1h avg(my_metric) as value
supports_drilldown = 0
supports_trellis = 0

[fixed_loaded_line_vanilla]
label = SplunkStuff - Loaded line KPI (JavaScript)
description = Readable vanilla JavaScript single-value line chart with hover and formatter options.
default_height = 200
search_fragment = | timechart span=1h avg(my_metric) as value
supports_drilldown = 0
supports_trellis = 0

[fixed_loaded_line]
label = SplunkStuff - Loaded line KPI (React)
description = React single-value line chart with optional comparison overlay, thresholds, SMA, downsampling, anomalies, and drilldown.
default_height = 200
search_fragment = | timechart span=1h avg(my_metric) as value
supports_drilldown = 0
supports_trellis = 0

[splunkstuff_pie_chart]
label = SplunkStuff - Data pie (JavaScript)
description = Vanilla JavaScript categorical pie chart with Top N + Other bucket. Expects a label column and a numeric column.
default_height = 220
search_fragment = | stats count by category_field
supports_drilldown = 0
supports_trellis = 0

[splunkstuff_pie_chart_react]
label = SplunkStuff - Data pie (React)
description = React implementation of the categorical pie chart with Top N + Other bucket.
default_height = 220
search_fragment = | stats count by category_field
supports_drilldown = 0
supports_trellis = 0

