# Custom visualization: fixed-domain single value + sparkline.
# Folder: appserver/static/visualizations/fixed_single_value/

[fixed_single_value]
label = SplunkStuff — Fixed single value (AMD)
description = Single value with delta and fixed min/max sparkline. Expects column-major results with at least one numeric field (last numeric column is used for the series).
default_height = 200
search_fragment = | timechart span=1h avg(my_metric) as value
supports_drilldown = 0
supports_trellis = 0

# Vanilla AMD: single value + footer SVG line with fixed Y min/max (no filled sparkband).
# Folder: appserver/static/visualizations/line_single_value/

[line_single_value]
label = SplunkStuff — Line single value (AMD)
description = Single value with delta and a footer line chart; fixed vertical scale via formatter min/max. Expects column-major results with at least one numeric column (last all-numeric column drives the series).
default_height = 200
search_fragment = | timechart span=1h avg(my_metric) as value
supports_drilldown = 0
supports_trellis = 0

# React-bundled variant (same UX intent; implementation mounts React into the viz container).
# Folder: appserver/static/visualizations/fixed_single_value_react/
[fixed_single_value_react]
label = SplunkStuff — Fixed single value (React bundle)
description = React-based single value with delta and fixed min/max sparkline. Expects column-major results with at least one numeric field (last numeric column is used for the series).
default_height = 200
search_fragment = | timechart span=1h avg(my_metric) as value
supports_drilldown = 0
supports_trellis = 0

# React LineChart demo parity (majors + footer line path, thresholds, comparison, anomalies).
# Folder: appserver/static/visualizations/fixed_loaded_line/

[fixed_loaded_line]
label = SplunkStuff — Fixed loaded line (React LineChart)
description = React LineChart single-value tile with delta and footer SVG line; fixed Y min/max; optional comparison overlay, thresholds, SMA, downsampling, anomalies, and drilldown. Uses _time when present and the last all-numeric non-_time column for the series.
default_height = 200
search_fragment = | timechart span=1h avg(my_metric) as value
supports_drilldown = 0
supports_trellis = 0

# Readable vanilla AMD (hand-maintained visualization.js; not Webpack).
# Folder: appserver/static/visualizations/fixed_loaded_line_vanilla/

[fixed_loaded_line_vanilla]
label = SplunkStuff — Fixed loaded line (vanilla AMD)
description = Readable AMD single-value + line chart; same formatter options as React fixed_loaded_line.
default_height = 200
search_fragment = | timechart span=1h avg(my_metric) as value
supports_drilldown = 0
supports_trellis = 0
